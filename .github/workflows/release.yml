name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    continue-on-error: ${{ matrix.arch == 'arm64' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libgtest-dev \
          libgl1-mesa-dev \
          libx11-dev \
          qtbase5-dev \
          qtdeclarative5-dev \
          qtmultimedia5-dev \
          qttools5-dev \
          qttools5-dev-tools \
          libavformat-dev \
          libavcodec-dev \
          libavutil-dev \
          libswscale-dev \
          libswresample-dev \
          libavdevice-dev \
          libva-dev \
          dpkg-dev

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run Tests
      run: ctest --test-dir build --output-on-failure

    - name: Package with CPack
      run: |
        cd build
        cpack -G "TGZ;DEB"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ matrix.arch }}
        path: |
          build/*.tar.gz
          build/*.deb

  build-windows:
    name: Build & Package (Windows x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-gtest
          mingw-w64-x86_64-nsis
          mingw-w64-x86_64-qt5-base
          mingw-w64-x86_64-qt5-declarative
          mingw-w64-x86_64-qt5-multimedia
          mingw-w64-x86_64-qt5-quickcontrols
          mingw-w64-x86_64-qt5-quickcontrols2
          mingw-w64-x86_64-qt5-graphicaleffects
          mingw-w64-x86_64-qt5-svg
          mingw-w64-x86_64-qt5-tools
          mingw-w64-x86_64-ffmpeg

    - name: Configure CMake
      run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run Tests
      run: ctest --test-dir build --output-on-failure

    - name: Package with CPack
      run: |
        cd build
        cpack -G "ZIP;NSIS"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages-windows-x86_64
        path: |
          build/*.zip
          build/*.exe

  release:
    name: Publish GitHub Release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
    - name: Download all packages
      uses: actions/download-artifact@v4
      with:
        path: release_packages
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release_packages/*.tar.gz
          release_packages/*.deb
          release_packages/*.zip
          release_packages/*.exe
        generate_release_notes: true
        make_latest: true
