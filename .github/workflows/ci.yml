name: StreamMatrix CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Ubuntu Linux)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libgtest-dev \
          libgl1-mesa-dev \
          libx11-dev \
          qtbase5-dev \
          qtdeclarative5-dev \
          qtmultimedia5-dev \
          qttools5-dev \
          qttools5-dev-tools \
          libavformat-dev \
          libavcodec-dev \
          libavutil-dev \
          libswscale-dev \
          libswresample-dev \
          libavdevice-dev \
          libva-dev

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run Tests
      run: ctest --test-dir build --output-on-failure

  build-windows:
    name: Build & Test (Windows x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-gtest
          mingw-w64-x86_64-qt5-base
          mingw-w64-x86_64-qt5-declarative
          mingw-w64-x86_64-qt5-multimedia
          mingw-w64-x86_64-qt5-quickcontrols
          mingw-w64-x86_64-qt5-quickcontrols2
          mingw-w64-x86_64-qt5-graphicaleffects
          mingw-w64-x86_64-qt5-svg
          mingw-w64-x86_64-qt5-tools
          mingw-w64-x86_64-ffmpeg

    - name: Configure CMake
      run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run Tests
      run: ctest --test-dir build --output-on-failure
